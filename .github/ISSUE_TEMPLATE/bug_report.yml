name: Bug report
description: Report a reproducible problem
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve this project. Remove secrets and personal data from every field.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Go to...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include version, operating system, browser, runtime, and deployment target when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add sanitized evidence. Never include credentials or personal data.